name: Update sector rotation website

on:
  schedule:
           - cron: "30 14 * * 1-5"  # Mon-Fri 8:00 PM IST (14:30 UTC), after Yahoo has the day's close
  workflow_dispatch:          # adds a "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install yfinance pandas numpy matplotlib
      - name: Run screener
        run: python sector_rotation_screener.py --out output

      - name: Copy report into the website folder
        run: |
          mkdir -p docs
          cp output/sector_rotation_report.html docs/index.html
          cp output/*.csv output/rrg_chart.png docs/ 2>/dev/null || true
          touch docs/.nojekyll

      - name: Update positions (model portfolio for the Positions tab)
        run: python paper_trade.py --dir docs/positions

      - name: Save to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Weekly update $(date +'%d %b %Y')" || echo "No changes"
          git push
